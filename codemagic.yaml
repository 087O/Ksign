workflows:
  ios-swiftui-build:
    name: Swift Store IPA
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Build App
        script: |
          xcodebuild clean build \
            -project Ksign.xcodeproj \
            -scheme Ksign \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=$CM_BUILD_DIR/build
      - name: Create IPA
        script: |
          cd $CM_BUILD_DIR/build
          mkdir Payload
          cp -r *.app Payload/
          zip -r SwiftStore.ipa Payload
          mv SwiftStore.ipa $CM_BUILD_DIR/
    artifacts:
      - "*.ipa"
