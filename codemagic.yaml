workflows:
  ios-swiftui-build:
    name: Build Swift Store IPA
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      ios_signing:
        distribution_type: ad_hoc
      vars:
        XCODE_WORKSPACE: "Ksign.xcworkspace"
        XCODE_SCHEME: "Ksign"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up build directory
        script: | 
          mkdir -p $CM_BUILD_DIR/build
      - name: Build IPA
        script: | 
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app
      - "*.ipa"
